name: WQIE conformance

on:
  pull_request:
    paths:
      - "schemas/**"
      - "docs/standards/WQIE-**"
      - "tests/wqie/**"
      - "requirements-wqie.txt"
      - ".github/workflows/wqie-conformance.yml"
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "docs/standards/WQIE-**"
      - "tests/wqie/**"
      - "requirements-wqie.txt"
      - ".github/workflows/wqie-conformance.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned validator
        run: python -m pip install -r requirements-wqie.txt
      - name: Run schema and semantic conformance tests
        run: python tests/wqie/validate_conformance.py
