<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WisdomIntercessor.com — حکمت جاویدان</title>
  <meta name="description" content="WisdomIntercessor — خانه و اکوسیستم حکمت.">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #07101d;
      color: #f2ead4;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 20px;
      background:
        radial-gradient(circle at 50% 35%, rgba(184,145,45,.16), transparent 32rem),
        linear-gradient(180deg, #07101d 0%, #0b1830 100%);
    }
    .frame {
      width: min(1100px, 100%);
      border: 1px solid rgba(208,170,73,.55);
      padding: 48px 28px;
      text-align: center;
      box-shadow: 0 0 70px rgba(0,0,0,.45);
    }
    .eyebrow { letter-spacing: .12em; opacity: .75; }
    h1 { margin: 18px 0 8px; font-size: clamp(2rem, 6vw, 4.5rem); }
    h2 { margin: 0; font-size: clamp(1.1rem, 2.4vw, 1.7rem); font-weight: 400; }
    .actions { margin-top: 38px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a {
      display: inline-block;
      padding: 12px 22px;
      border: 1px solid #b89a4a;
      color: #f2ead4;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <section class="frame">
      <div class="eyebrow">WISDOMINTERCESSOR.COM</div>
      <h1>حکمت جاویدان</h1>
      <h2>Eternal Wisdom Charter / Wisdom Pact</h2>
      <div class="actions">
        <a href="#">پیوستن به حکمت</a>
        <a href="#">منشور حکمت جاویدان</a>
      </div>
    </section>
  </main>
</body>
</html>
