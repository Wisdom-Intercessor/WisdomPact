<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="t d"><title id="t">پیوستگی قلمروهای حکمت</title><desc id="d">پنج قلمرو فرد، خانواده، جامعه و نهادها، حکمرانی، و جهان و نسل‌های آینده در پیوند با منشور حکمت جاویدان.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d19"/><stop offset="1" stop-color="#18243a"/></linearGradient><linearGradient id="gold"><stop offset="0" stop-color="#8f6c32"/><stop offset=".5" stop-color="#e1c27b"/><stop offset="1" stop-color="#9c783d"/></linearGradient></defs><rect width="1600" height="1050" rx="36" fill="url(#bg)"/><text x="800" y="95" fill="#e4c982" font-size="44" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-weight="700">پیوستگی قلمروهای حکمت</text><text x="800" y="145" fill="#c3cedd" font-size="25" font-family="Tahoma,Arial,sans-serif" text-anchor="middle">از مسئولیت فردی تا مسئولیت تمدنی و بین‌نسلی</text><g stroke="url(#gold)" stroke-width="5" fill="none"><path d="M800 525 L800 270"/><path d="M800 525 L1270 430"/><path d="M800 525 L1120 820"/><path d="M800 525 L480 820"/><path d="M800 525 L330 430"/></g><g fill="#101a2b" stroke="#c8a760" stroke-width="3"><rect x="610" y="195" width="380" height="150" rx="24"/><rect x="1110" y="350" width="390" height="160" rx="24"/><rect x="940" y="760" width="440" height="160" rx="24"/><rect x="220" y="760" width="440" height="160" rx="24"/><rect x="100" y="350" width="390" height="160" rx="24"/></g><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><text x="800" y="255" fill="#e7d39e" font-size="34" font-weight="700">فرد</text><text x="800" y="302" fill="#d4deeb" font-size="22">خودشناسی • داوری • مسئولیت</text><text x="1305" y="415" fill="#e7d39e" font-size="34" font-weight="700">خانواده</text><text x="1305" y="462" fill="#d4deeb" font-size="22">کرامت • گفت‌وگو • مراقبت</text><text x="1160" y="825" fill="#e7d39e" font-size="34" font-weight="700">جامعه و نهادها</text><text x="1160" y="872" fill="#d4deeb" font-size="22">عدالت • مشارکت • پاسخ‌گویی</text><text x="440" y="825" fill="#e7d39e" font-size="34" font-weight="700">حکمرانی</text><text x="440" y="872" fill="#d4deeb" font-size="22">قانون • نظارت • انتقال مسئولیت</text><text x="295" y="415" fill="#e7d39e" font-size="34" font-weight="700">جهان و آینده</text><text x="295" y="462" fill="#d4deeb" font-size="22">طبیعت • زمان • عدالت نسلی</text></g><circle cx="800" cy="525" r="165" fill="#111d30" stroke="url(#gold)" stroke-width="7"/><text x="800" y="490" fill="#e4c982" font-size="36" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700">منشور</text><text x="800" y="540" fill="#e4c982" font-size="36" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700">حکمت جاویدان</text><text x="800" y="590" fill="#cbd5e1" font-size="21" text-anchor="middle" font-family="Tahoma,Arial,sans-serif">کرامت • عدالت • مسئولیت • نقدپذیری</text><text x="800" y="1000" fill="#94a3b8" font-size="18" text-anchor="middle" font-family="Tahoma,Arial,sans-serif">نمودار مفهومی پیشنهادی — نه طبقه‌بندی علمی یا حقوقی قطعی</text></svg>