<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="t d"><title id="t">چرخه احتمالی بحران جانشینی</title><desc id="d">چرخه تحلیلی تمرکز قدرت، ابهام جانشینی، رقابت نخبگان، برکناری یا خشونت، فرسایش اعتماد و بازتمرکز قدرت.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d19"/><stop offset="1" stop-color="#18243a"/></linearGradient><linearGradient id="gold"><stop offset="0" stop-color="#92703b"/><stop offset=".5" stop-color="#e1c27b"/><stop offset="1" stop-color="#92703b"/></linearGradient><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#c8a760"/></marker></defs><rect width="1600" height="980" rx="36" fill="url(#bg)"/><text x="800" y="90" fill="#e4c982" font-size="44" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700">چرخه احتمالی بحران جانشینی</text><text x="800" y="140" fill="#c3cedd" font-size="24" text-anchor="middle" font-family="Tahoma,Arial,sans-serif">الگوی تحلیلی برای برخی منازعات تاریخی؛ نه قانون همیشگی تاریخ</text><g fill="#101a2b" stroke="#c8a760" stroke-width="3"><rect x="610" y="190" width="380" height="120" rx="22"/><rect x="1080" y="355" width="400" height="120" rx="22"/><rect x="930" y="650" width="420" height="120" rx="22"/><rect x="250" y="650" width="420" height="120" rx="22"/><rect x="120" y="355" width="400" height="120" rx="22"/></g><g fill="none" stroke="#c8a760" stroke-width="5" marker-end="url(#arr)"><path d="M990 250 C1100 260 1150 300 1240 350"/><path d="M1280 475 C1280 555 1220 600 1160 645"/><path d="M930 710 C820 830 760 830 670 710"/><path d="M460 650 C350 600 310 555 320 475"/><path d="M520 355 C610 270 680 245 610 245"/></g><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><text x="800" y="238" fill="#e7d39e" font-size="32" font-weight="700">تمرکز قدرت</text><text x="800" y="278" fill="#d4deeb" font-size="21">وابستگی نهادها به شخص</text><text x="1280" y="405" fill="#e7d39e" font-size="32" font-weight="700">ابهام جانشینی</text><text x="1280" y="445" fill="#d4deeb" font-size="21">نبود روند پذیرفته‌شده</text><text x="1140" y="700" fill="#e7d39e" font-size="32" font-weight="700">رقابت نخبگان</text><text x="1140" y="740" fill="#d4deeb" font-size="21">ائتلاف‌ها و مدعیان رقیب</text><text x="460" y="700" fill="#e7d39e" font-size="32" font-weight="700">برکناری یا خشونت</text><text x="460" y="740" fill="#d4deeb" font-size="21">بحران سیاسی و خانوادگی</text><text x="320" y="405" fill="#e7d39e" font-size="32" font-weight="700">فرسایش اعتماد</text><text x="320" y="445" fill="#d4deeb" font-size="21">تضعیف نهادها و قواعد</text></g><rect x="590" y="405" width="420" height="170" rx="28" fill="#17243a" stroke="#e0c27b" stroke-width="4"/><text x="800" y="465" fill="#e4c982" font-size="34" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700">راه گسستن چرخه</text><text x="800" y="515" fill="#dbe4ef" font-size="23" text-anchor="middle" font-family="Tahoma,Arial,sans-serif">قواعد روشن • نظارت مستقل</text><text x="800" y="550" fill="#dbe4ef" font-size="23" text-anchor="middle" font-family="Tahoma,Arial,sans-serif">انتقال مسالمت‌آمیز • پاسخ‌گویی</text><text x="800" y="925" fill="#94a3b8" font-size="18" text-anchor="middle" font-family="Tahoma,Arial,sans-serif">الگوی مفهومی؛ روابط علّی باید برای هر دوره با شواهد تاریخی سنجیده شوند</text></svg>